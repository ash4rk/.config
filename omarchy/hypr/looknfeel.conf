windowrulev2 = float, title:(RMC2 I/O Simulator)
windowrulev2 = move 14 38, title:(RMC2 I/O Simulator)
windowrulev2 = size 716 238, title:(RMC2 I/O Simulator)

windowrulev2 = float, title:(RMC2 Platform)
windowrulev2 = move 280 108, title:(RMC2 Platform)
windowrulev2 = size 865 743, title:(RMC2 Platform)

windowrulev2 = float, initialClass:(Godot)
windowrulev2 = move 921 54, initialClass:(Godot)
windowrulev2 = size 480 820, initialClass:(Godot)
